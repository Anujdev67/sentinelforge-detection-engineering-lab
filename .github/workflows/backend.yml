name: Backend quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Audit production Python dependencies
        run: |
          python -m pip install pip-audit==2.10.0
          python -m pip_audit . --progress-spinner off
      - name: Ruff
        run: python -m ruff check .
      - name: MyPy strict
        run: python -m mypy apps detections evaluators telemetry soar scripts tests
      - name: Unit and integration tests
        run: python -m pytest --cov=apps --cov=detections --cov=evaluators --cov=telemetry
