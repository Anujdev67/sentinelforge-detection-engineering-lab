name: Backend quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: MyPy strict
        run: python -m mypy apps detections evaluators telemetry soar scripts tests
      - name: Unit and integration tests
        run: python -m pytest --cov=apps --cov=detections --cov=evaluators --cov=telemetry
