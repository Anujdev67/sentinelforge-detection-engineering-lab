title: Encoded or Suspicious PowerShell Execution
id: bcdde8a1-e9f4-4f44-8ed7-52c0e8f50105
status: stable
description: Detects PowerShell command-line indicators aligned with SentinelForge SF-005.
author: SentinelForge
date: 2026-08-11
modified: 2026-08-11
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_indicator:
    CommandLine|contains:
      - '-EncodedCommand'
      - ' -enc '
      - 'FromBase64String'
      - 'Invoke-WebRequest'
      - '-WindowStyle Hidden'
  condition: selection_image and selection_indicator
falsepositives:
  - Approved device-management and software-deployment automation
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027

