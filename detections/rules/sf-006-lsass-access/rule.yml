title: Process Command Line Targeting LSASS Memory
id: 2db61d8c-c925-4680-89e2-e35047db0106
status: stable
description: Detects common process command lines requesting an LSASS dump, aligned with SentinelForge SF-006.
author: SentinelForge
date: 2026-08-11
modified: 2026-08-11
logsource:
  category: process_creation
  product: windows
detection:
  selection_procdump:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains: 'lsass'
  selection_comsvcs:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs.dll'
      - 'MiniDump'
  condition: selection_procdump or selection_comsvcs
falsepositives:
  - Approved endpoint diagnostics or memory forensics
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001

