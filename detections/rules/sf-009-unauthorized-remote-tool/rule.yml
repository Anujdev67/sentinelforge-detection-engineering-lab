title: AnyDesk or TeamViewer Process Execution
id: 86d11cdb-4a3e-471c-a980-882975aa0109
status: stable
description: Detects remote-support process execution for approval correlation, aligned with SentinelForge SF-009.
author: SentinelForge
date: 2026-08-11
modified: 2026-08-11
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\anydesk.exe'
      - '\teamviewer.exe'
      - '\teamviewer_service.exe'
  condition: selection
falsepositives:
  - Approved remote-support sessions
level: high
tags:
  - attack.command-and-control
  - attack.t1219.002

